name: keep-alive
# Pings the app every 5 minutes so Render's free tier does not spin it down
# (a cold start shows Render's "loading" page for 30-60 s to the first visitor).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app.feesaathi.com
        run: |
          for url in https://app.feesaathi.com/login https://app.feesaathi.com/api/auth/google; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url")
            echo "$url -> $code"
          done
